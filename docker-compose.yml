services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: pos_demo
    # 5433 en el host para no chocar con un Postgres que ya tengas en 5432.
    # Solo escucha en 127.0.0.1: la base no se ve desde la red.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
